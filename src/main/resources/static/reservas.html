<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda - Panel de Control</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
  </head>

  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="#">Mi Agenda</a>
        <div class="navbar-nav">
          <a class="nav-link active" href="reservas.html">Gestionar Citas</a>
          <a class="nav-link text-info" href="reservas-realizadas.html">
            <i class="bi bi-list-check"></i> Ver Reservas Hechas
          </a>
        </div>
      </div>
    </nav>

    <div class="container">
      <div class="row">
        <div class="col-md-4 mb-4">
          <div class="card shadow-sm sticky-top" style="top: 20px">
            <div class="card-header bg-primary text-white">
              <h6 class="mb-0">Seleccionar Cliente</h6>
            </div>
            <div class="card-body">
              <select
                id="selectCliente"
                class="form-select form-select-lg"
              ></select>
              <div class="card-body mt-3 border-top pt-3">
                <label class="form-label fw-bold">Fecha de Agenda</label>
                <input type="date" id="fechaAgenda" class="form-control" />
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-8">
          <div class="card shadow-sm">
            <div class="card-header bg-white">
              <h5 class="mb-0">Reservas de 10:00 - 20:00</h5>
            </div>
            <div class="card-body p-0">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Intervalo</th>
                    <th>Estado</th>
                    <th class="text-end">Acción</th>
                  </tr>
                </thead>
                <tbody id="tablaCitas">
                  <tr id="fila-10-00">
                    <td class="fw-bold">10:00 - 10:30</td>
                    <td id="info-10-00">
                      <span class="badge bg-success">Libre</span>
                    </td>
                    <td class="text-end">
                      <button
                        class="btn btn-sm btn-outline-primary btn-agendar"
                        data-hora-inicio="10:00"
                        data-hora-fin="10:30"
                      >
                        Agendar Cita
                      </button>
                    </td>
                  </tr>
                  <tr id="fila-10-30">
                    <td class="fw-bold">10:30 - 11:00</td>
                    <td id="info-10-30">
                      <span class="badge bg-success">Libre</span>
                    </td>
                    <td class="text-end">
                      <button
                        class="btn btn-sm btn-outline-primary btn-agendar"
                        data-hora-inicio="10:30"
                        data-hora-fin="11:00"
                      >
                        Agendar Cita
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/reservas.js"></script>
  </body>
</html>
