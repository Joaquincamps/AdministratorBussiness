<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial Servicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; border-radius: 12px; }
        .card-header { border-radius: 12px 12px 0 0 !important; font-weight: 600; }
        .form-label { font-size: 0.85rem; font-weight: 600; color: #495057; }
        .btn { border-radius: 8px; font-weight: 500; transition: all 0.2s; }
        .btn:hover { transform: translateY(-1px); }
        .table-container { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark px-4 shadow-sm mb-4">
        <span class="navbar-brand mb-0 h1"><i class="bi bi-speedometer2 me-2"></i>Panel Administrador</span>
        <div class="d-flex">
            <a th:href="@{/servicios}" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Volver a Servicios
            </a>
        </div>
    </nav>

    <div class="container">
        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white py-3">
                <i class="bi bi-calculator me-2"></i> Centro de Cálculos y Totales
            </div>
            <div class="card-body p-4">
                <div class="row g-4">
                    
                    <div class="col-lg-4 col-md-6 border-end">
                        <form th:action="@{/servicios/historial/total}" method="get">
                            <label class="form-label text-uppercase small text-muted">Cálculo por Día</label>
                            <div class="input-group mb-2">
                                <input type="date" name="fecha" class="form-control" required />
                                <button class="btn btn-success">Calcular</button>
                            </div>
                        </form>
                        <div class="mt-3 p-3 bg-light rounded text-center">
                            <span class="d-block small text-muted">Resultado Día</span>
                            <h4 class="mb-0 text-success" th:text="${totalDia != null ? totalDia + ' €' : '0.00 €'}"></h4>
                        </div>
                    </div>

                    <div class="col-lg-4 col-md-6 border-end">
                        <form th:action="@{/servicios/servicio/total}" method="get">
                            <label class="form-label text-uppercase small text-muted">Cálculo por Servicio</label>
                            <select class="form-select mb-2" name="idServicio" required>
                                <option value="">Seleccione servicio...</option>
                                <option th:each="serv : ${servicios}" th:value="${serv.id}" th:text="${serv.tipoServicio}"></option>
                            </select>
                            <button class="btn btn-primary w-100">Consultar Precio</button>
                        </form>
                        <div class="mt-3 p-3 bg-light rounded text-center">
                            <span class="d-block small text-muted">Total Acumulado</span>
                            <h4 class="mb-0 text-primary" th:text="${total != null ? total + ' €' : '0.00 €'}"></h4>
                        </div>
                    </div>

                    <div class="col-lg-4 col-md-12">
                        <form th:action="@{/servicios/servicio/total/rango/fechas}" method="get">
                            <label class="form-label text-uppercase small text-muted">Cálculo por Rango</label>
                            <div class="row g-2 mb-2">
                                <div class="col-6">
                                    <input type="date" name="fecha1" class="form-control" required />
                                </div>
                                <div class="col-6">
                                    <input type="date" name="fecha2" class="form-control" required />
                                </div>
                            </div>
                            <button class="btn btn-dark w-100">Calcular Rango</button>
                        </form>
                        <div class="mt-3 p-3 bg-light rounded text-center">
                            <span class="d-block small text-muted">Resultado Rango</span>
                            <h4 class="mb-0 text-dark" th:text="${totalRango != null ? totalRango + ' €' : '0.00 €'}"></h4>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div class="table-container shadow-sm mb-5">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 gap-3">
                <h5 class="mb-0 text-dark"><i class="bi bi-list-ul me-2"></i>Servicios Registrados</h5>
                
                <form th:action="@{/servicios/historial/filtrar}" method="get" class="d-flex gap-2 align-items-center">
                    <label class="form-label mb-0 text-nowrap d-none d-sm-block">Filtrar tabla:</label>
                    <input type="date" name="fecha" class="form-control form-control-sm" required />
                    <button class="btn btn-warning btn-sm px-3">
                        <i class="bi bi-search"></i>
                    </button>
                </form>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-uppercase">
                        <tr>
                            <th class="py-3" style="width: 10%;">ID</th>
                            <th class="py-3">Tipo de Servicio</th>
                            <th class="py-3 text-center">Precio</th>
                            <th class="py-3 text-center">Fecha de Registro</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="reg : ${registros}">
                            <td class="fw-bold text-muted" th:text="'#' + ${reg.id}"></td>
                            <td>
                                <span class="badge bg-info text-dark py-2 px-3 rounded-pill" th:text="${reg.servicio.tipoServicio}"></span>
                            </td>
                            <td class="text-center fw-bold text-dark" th:text="${reg.precio} + ' €'"></td>
                            <td class="text-center text-muted" th:text="${reg.fecha}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(registros)}">
                            <td colspan="4" class="text-center py-4 text-muted">
                                No se encontraron registros para los criterios seleccionados.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
