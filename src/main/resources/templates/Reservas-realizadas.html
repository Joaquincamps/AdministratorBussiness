<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Reservas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-xl-10">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h3 class="fw-bold mb-1 text-dark">Gestión de Citas</h3>
              <p class="text-muted mb-0">
                Visualiza y administra las reservas actuales.
              </p>
            </div>
          </div>

          <div class="card main-card shadow-lg">
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead>
                    <tr>
                      <th>Fecha</th>
                      <th>Horario</th>
                      <th>Cliente</th>
                      <th class="text-end">Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="listaReservas"></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="text-center mt-4">
            <small class="text-muted"
              >Mostrando todas las citas registradas en el sistema</small
            >
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="reservas-realizadas.js"></script>
  </body>
</html>
